[package]
name = "pookieclip"
version = "0.1.0"
description = "A fast, searchable clipboard manager for Linux"
authors = ["Grace Peter Mutiibwa"]
license = "MIT"
repository = "https://github.com/GracePeterMutiibwa/pookieclip"
edition = "2024"
rust-version = "1.90"

[lib]
name = "pookieclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
gtk = "0.18"
sha2 = "0.11"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
